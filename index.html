
<div class="video-wrap">
  <video
    id="fireVideo"
    preload="metadata"
    playsinline
    webkit-playsinline
  >
    <source
      src="https://h2027125863-lgtm.github.io/fire-video/fire%20viedo.mp4"
      type="video/mp4"
    >
  </video>

  <button id="playButton" aria-label="播放视频">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29"
        fill="rgba(0,0,0,0.38)"
        stroke="rgba(255,255,255,0.85)"
        stroke-width="1.5"/>
      <path d="M26 20 L46 32 L26 44 Z"
        fill="white"/>
    </svg>
  </button>
</div>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent !important;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  #fireVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: transparent;
    cursor: pointer;
  }

  #playButton {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 76px;
    height: 76px;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    z-index: 2;
    transition: opacity 0.25s ease;
  }

  #playButton svg {
    width: 100%;
    height: 100%;
  }

  #playButton:hover {
    opacity: 0.75;
  }

  #playButton.hidden {
    display: none;
  }
</style>

<script>
  const video = document.getElementById("fireVideo");
  const button = document.getElementById("playButton");

  function updateButton() {
    button.classList.toggle("hidden", !video.paused);
  }

  async function toggleVideo() {
    if (video.paused) {
      try {
        await video.play();
      } catch (error) {
        console.error("视频播放失败", error);
      }
    } else {
      video.pause();
    }
    updateButton();
  }

  button.addEventListener("click", toggleVideo);
  video.addEventListener("click", toggleVideo);
  video.addEventListener("play", updateButton);
  video.addEventListener("pause", updateButton);
  video.addEventListener("ended", updateButton);
</script>
